<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>プロフィール | TeacherAssist</title>
  <link rel="stylesheet" href="../css/theme.css?v=20261108-3">
  <script type="module" src="../js/profile.js?v=20261108-5"></script>
</head>
<body>
<main class="management-page">
  <h1>プロフィール</h1>
  <div class="page-actions"><a href="home.html" class="btn">メニューに戻る</a></div>
  <p id="status" role="status">ログイン情報を確認しています…</p>
  <section id="content" class="card" hidden>
    <dl class="profile-details">
      <div><dt>氏名</dt><dd id="userName"></dd></div>
      <div><dt>メールアドレス</dt><dd id="userEmail"></dd></div>
    </dl>
    <form id="profileForm" class="page-footer">
      <div class="profile-school-grid">
        <div><label for="prefecture">都道府県</label><select id="prefecture" required disabled><option value="">都道府県を選択してください</option></select></div>
        <div><label for="city">市区町村</label><select id="city" required disabled><option value="">先に都道府県を選択してください</option></select></div>
        <div><label for="school">学校（公立小学校）</label><select id="school" required disabled><option value="">先に市区町村を選択してください</option></select></div>
      </div>
      <div class="page-actions"><button id="saveProfileButton" class="btn btn-primary" type="submit" disabled>登録</button></div>
      <p class="school-source">学校一覧：<a href="https://www.mext.go.jp/b_menu/toukei/mext_01087.html" target="_blank" rel="noopener noreferrer">文部科学省 学校コード一覧</a>（令和8年5月1日時点・暫定版）</p>
    </form>
  </section>
  <section id="profileTextbooks" class="card page-footer" hidden aria-labelledby="profileTextbooksTitle">
    <h2 id="profileTextbooksTitle">登録した学校の採択教科書</h2>
    <p id="profileTextbooksSchool"></p>
    <p id="profileTextbooksStatus" role="status"></p>
    <div class="list-scroll">
      <table class="subject-table">
        <thead><tr><th scope="col">学年</th><th scope="col">科目</th><th scope="col">採択している教科書・出版社</th><th scope="col">使用年度</th><th scope="col">公開採択情報</th></tr></thead>
        <tbody id="profileTextbookList"></tbody>
      </table>
    </div>
  </section>
  <div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div>
  <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
