<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ユーザーメニュー | TeacherAssist</title>
  <link rel="stylesheet" href="../css/theme.css">
  <script type="module" src="../js/home.js"></script>
</head>
<body>
<main class="center-wrap">
  <div class="card menu-card">
    <h1>ユーザーメニュー</h1>
    <p id="status" role="status">ログイン情報を確認しています…</p>
    <section id="content" hidden aria-label="ユーザーメニュー">
      <p><span id="userName"></span>さん</p>
      <p id="userEmail" hidden></p>
      <div class="menu-list">
        <div class="menu-row">
          <a href="profile.html" class="btn btn-primary menu-btn">プロフィール</a>
          <div class="menu-text">登録されている氏名とメールアドレスを確認します。</div>
        </div>
      </div>
    </section>
    <div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div>
    <p id="error" class="error" role="alert"></p>
  </div>
</main>
</body>
</html>
