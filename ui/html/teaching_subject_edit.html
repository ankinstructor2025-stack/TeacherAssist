<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>担当科目編集 | TeacherAssist</title>
  <link rel="stylesheet" href="../css/theme.css?v=20261108-4">
  <script type="module" src="../js/teaching-subject-edit.js?v=20261108-5"></script>
</head>
<body>
<main class="management-page">
  <header id="schoolToolbar" class="page-toolbar"></header>
  <p id="status" role="status">ログイン情報を確認しています…</p>
  <section id="content" class="card" hidden aria-label="担当科目編集">
    <p id="profileNotice" hidden>学校が登録されていません。<a href="profile.html">プロフィールで学校を登録してください。</a></p>
    <form id="assignmentForm">
      <div class="form-grid">
        <div><label for="grade">学年</label><select id="grade" required><option value="">学年を選択してください</option></select></div>
        <div><label for="subject">科目</label><select id="subject" required><option value="">科目を選択してください</option></select></div>
      </div>
      <div class="page-footer"><label for="textbook">教科書</label><output id="textbook" class="textbook-output" aria-live="polite">学年と科目を選択してください。</output></div>
    </form>
  </section>
  <div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div>
  <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
