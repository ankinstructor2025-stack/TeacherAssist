<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザー管理 | TeacherAssist</title>
  <link rel="stylesheet" href="../css/theme.css">
  <script type="module" src="../js/system.js"></script>
</head>
<body>
<main class="container card">
  <h1>ユーザー管理</h1>
  <a href="system_menu.html">戻る</a>
  <p id="status" role="status">確認しています…</p>
  <section id="content" hidden>
    <button id="addUserButton" type="button">新規登録</button>
    <form id="userForm" hidden>
      <h2 id="formTitle">ユーザー登録</h2>
      <p><label for="userName">氏名</label><input id="userName" required maxlength="100" autocomplete="name"></p>
      <p><label for="email">メールアドレス</label><input id="email" type="email" required maxlength="254" autocomplete="email"></p>
      <button id="saveButton" type="submit">保存</button>
      <button id="cancelButton" type="button">キャンセル</button>
    </form>
    <h2>登録ユーザー</h2>
    <div id="userList"></div>
  </section>
  <button id="logoutButton" type="button">ログアウト</button>
  <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
