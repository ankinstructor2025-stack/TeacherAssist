<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>モデル登録 | TeacherAssist</title>
  <link rel="stylesheet" href="../css/theme.css?v=20261108-7">
  <script type="module" src="../js/system-model-edit.js"></script>
</head>
<body>
<main class="management-page">
  <header class="page-toolbar">
    <h1 id="pageTitle" class="page-toolbar-title">モデル登録</h1>
    <div></div>
    <nav class="page-toolbar-actions" aria-label="画面操作"><button id="saveButton" class="btn btn-primary" type="submit" form="modelForm" disabled>保存</button><a href="system_models.html" class="btn">一覧に戻る</a></nav>
  </header>
  <p id="status" role="status">ログイン情報を確認しています…</p>
  <section id="content" class="card" hidden>
    <form id="modelForm" class="form-grid">
      <div><label for="provider">AIの種類</label><select id="provider" required><option value="openai">OpenAI</option><option value="gemini">Gemini</option><option value="takane">Takane</option></select></div>
      <div><label for="modelName">モデル名</label><input id="modelName" required maxlength="100" autocomplete="off" spellcheck="false"></div>
      <div><label for="enabled">状態</label><select id="enabled" required><option value="true">有効</option><option value="false">無効</option></select></div>
    </form>
  </section>
  <div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div>
  <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
