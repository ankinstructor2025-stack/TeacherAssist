<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>担当科目 | TeacherAssist</title>
  <link rel="stylesheet" href="../css/theme.css?v=20261108-2">
  <script type="module" src="../js/teaching-subjects.js"></script>
</head>
<body>
<main class="management-page">
  <header id="schoolToolbar" class="page-toolbar"></header>
  <p id="status" role="status">ログイン情報を確認しています…</p>
  <section id="content" class="card" hidden aria-label="担当科目一覧">
    <div class="form-grid">
      <div><label for="grade">学年</label><select id="grade"><option value="">すべての学年</option></select></div>
      <div><label for="subject">科目</label><select id="subject"><option value="">すべての科目</option></select></div>
    </div>
    <p id="listStatus" role="status"></p>
    <p id="profileNotice" hidden>学校が登録されていません。<a href="profile.html">プロフィールで学校を登録してください。</a></p>
    <div class="list-scroll">
      <table class="subject-table">
        <caption class="subject-caption">所属校の採択教科書</caption>
        <thead><tr><th scope="col">学年</th><th scope="col">科目</th><th scope="col">採択している教科書・出版社</th><th scope="col">使用年度</th><th scope="col">公開採択情報</th></tr></thead>
        <tbody id="subjectList"></tbody>
      </table>
    </div>
  </section>
  <div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div>
  <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
