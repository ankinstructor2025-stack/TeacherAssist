<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>指導案編集 | TeacherAssist</title>
  <link rel="stylesheet" href="../css/theme.css?v=20261108-20">
  <script type="module" src="../js/lesson-plan-edit.js?v=20261108-19"></script>
</head>
<body>
<main class="management-page lesson-editor-page lesson-editor-wide">
  <header id="schoolToolbar" class="page-toolbar"></header>
  <p id="status" role="status">ログイン情報を確認しています…</p>
  <section id="content" class="card" hidden aria-label="指導案編集">
    <p id="lessonContext" class="lesson-context"></p>
    <div class="lesson-workspace">
    <aside class="lesson-sidebar" aria-labelledby="contentsTitle">
      <h2 id="contentsTitle">単元・教材一覧</h2>
      <div id="contentsList" class="contents-list"></div>
      <p id="contentsStatus" role="status"></p>
    </aside>
    <form id="lessonPlanForm" class="lesson-fields lesson-plan-grid">
      <div class="lesson-edit-actions"><p id="planCreatedAt" class="lesson-created-at" role="status">未作成</p><a class="btn" href="profile_prompt_edit.html">プロンプト設定</a><button id="suggestLessonButton" class="btn btn-primary" type="button" disabled>AI提案</button></div>
      <p id="aiSuggestionStatus" role="status" aria-live="polite"></p>
      <div><label for="planTitle">指導案名</label><input id="planTitle" required maxlength="150"></div>
      <div class="form-grid">
        <div><label for="unit">単元・教材名</label><input id="unit" required maxlength="200"><small>目次の項目を押すと入力されます。直接入力もできます。</small></div>
        <div><label for="hours">時数</label><input id="hours" type="number" min="1" max="100" value="1" required></div>
      </div>
      <div><label for="objectives">本時の目標</label><textarea id="objectives" rows="4" maxlength="10000"></textarea></div>
      <div><label for="activities">授業の展開（時間配分・教師の発問・児童の活動）</label><textarea id="activities" rows="16" maxlength="20000"></textarea></div>
      <div class="lesson-dialogue-scroll" role="region" aria-label="先生の発言案と児童の想定質問" tabindex="0">
      <div class="lesson-flow-columns">
      <section class="lesson-question-panel lesson-flow-panel" aria-labelledby="teacherScriptTitle">
        <div class="dialogue-heading"><h2 id="teacherScriptTitle">先生の発言案</h2><button id="teacherScriptToggle" type="button" class="btn" aria-controls="teacherScript">文章を修正</button></div>
        <p>時間・場面ごとに、授業の進行順で表示します。</p>
        <div id="teacherScriptPreview" class="dialogue-preview"></div>
        <label for="teacherScript">時間・場面・先生の発言</label>
        <textarea id="teacherScript" rows="18" maxlength="20000" placeholder="時間：0〜5分&#10;場面：導入&#10;先生：前の時間に学んだことを思い出しましょう。"></textarea>
      </section>
      <section class="lesson-question-panel lesson-flow-panel" aria-labelledby="studentQuestionsTitle">
        <div class="dialogue-heading"><h2 id="studentQuestionsTitle">想定質問・返答例</h2><button id="studentQuestionsToggle" type="button" class="btn" aria-controls="studentQuestions">文章を修正</button></div>
        <p>児童の質問、先生の返答、確かめる問いを区別します。</p>
        <div id="studentQuestionsPreview" class="dialogue-preview"></div>
        <label for="studentQuestions">場面・児童の質問・教師の返答・確かめる問い</label>
        <textarea id="studentQuestions" rows="12" maxlength="10000"></textarea>
        <details><summary>想定質問の参考資料</summary><p id="questionSourcesStatus" role="status"></p><div id="questionSources"></div></details>
      </section>
      </div>
      </div>
      <div><label for="assessment">評価の観点・方法</label><textarea id="assessment" rows="4" maxlength="10000"></textarea></div>
      <div><label for="notes">教材・準備・備考</label><textarea id="notes" rows="4" maxlength="10000"></textarea></div>
    </form>
    </div>
  </section>
  <div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div>
  <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
