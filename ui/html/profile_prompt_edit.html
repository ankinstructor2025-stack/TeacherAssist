<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プロンプト設定 | TeacherAssist</title><link rel="stylesheet" href="../css/theme.css?v=20261108-10"><script type="module" src="../js/profile-prompt-edit.js?v=20261108-14"></script></head>
<body><main class="management-page">
<header id="schoolToolbar" class="page-toolbar"></header>
<p id="status" role="status">ログイン情報を確認しています…</p><section id="content" class="card" hidden>
<div class="page-actions"><a class="btn" href="profile_prompt_edit.html?type=lesson_plan">指導案作成用</a><a class="btn" href="profile_prompt_edit.html?type=homework">宿題作成用</a></div>
<p>授業や宿題の指導方針を設定します。回答の項目名と出力形式は固定です。</p>
<label class="prompt-common-choice"><input id="useCommonPrompt" type="checkbox" checked>共通設定を使用する（追加方針なし）</label><p>カスタマイズする場合はチェックを外し、追加したい指導方針を入力してください。共通方針も引き続き使われます。</p>
<form id="promptForm" class="lesson-fields"><div><label id="promptLabel" for="promptText">指導方針</label><textarea id="promptText" rows="16"></textarea></div><div class="page-actions"><button id="saveButton" class="btn btn-primary" type="submit" disabled>保存</button></div></form>
<p id="message" role="status"></p><details><summary>固定ルール（編集不可）</summary><p id="fixedRules" class="fixed-prompt-rules"></p></details>
</section><div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div><p id="error" class="error" role="alert"></p>
</main></body></html>
