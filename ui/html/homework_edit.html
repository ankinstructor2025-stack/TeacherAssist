<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宿題作成 | TeacherAssist</title><link rel="stylesheet" href="../css/theme.css?v=20261108-14"><script type="module" src="../js/homework-edit.js"></script></head><body>
<main class="management-page lesson-editor-page"><header id="schoolToolbar" class="page-toolbar"></header><p id="status" role="status">ログイン情報を確認しています…</p><section id="content" class="card" hidden><p id="homeworkContext" class="lesson-context"></p>
<form id="homeworkForm" class="lesson-fields"><div class="lesson-edit-actions"><p id="homeworkCreatedAt" class="lesson-created-at">未作成</p><a class="btn" href="profile_prompt_edit.html?type=homework">プロンプト設定</a><button id="generateHomeworkButton" class="btn btn-primary" type="button" disabled>宿題を自動作成</button></div>
<p id="generationStatus" role="status"></p><div><label for="homeworkTitle">宿題名</label><input id="homeworkTitle" required maxlength="150"></div><div class="form-grid"><div><label for="unit">単元・教材名</label><input id="unit" list="unitOptions" maxlength="200" required><datalist id="unitOptions"></datalist></div><div><label for="minutes">各段階の目安時間（分）</label><input id="minutes" type="number" min="5" max="60" value="15" required></div></div><div class="homework-levels"><section class="homework-level"><h2>初級</h2><p>基礎の確認・ヒント付き</p><label for="beginner_questions">問題</label><textarea id="beginner_questions" rows="12" maxlength="10000" required></textarea><details class="page-footer"><summary>教師用：解答例・解説</summary><label for="beginner_answers">解答例・解説</label><textarea id="beginner_answers" rows="8" maxlength="10000" required></textarea></details></section><section class="homework-level"><h2>中級</h2><p>基本を活用・理由を説明</p><label for="intermediate_questions">問題</label><textarea id="intermediate_questions" rows="12" maxlength="10000" required></textarea><details class="page-footer"><summary>教師用：解答例・解説</summary><label for="intermediate_answers">解答例・解説</label><textarea id="intermediate_answers" rows="8" maxlength="10000" required></textarea></details></section><section class="homework-level"><h2>上級</h2><p>応用・発展・考えを深める</p><label for="advanced_questions">問題</label><textarea id="advanced_questions" rows="12" maxlength="10000" required></textarea><details class="page-footer"><summary>教師用：解答例・解説</summary><label for="advanced_answers">解答例・解説</label><textarea id="advanced_answers" rows="8" maxlength="10000" required></textarea></details></section></div></form>
</section><div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div><p id="error" class="error" role="alert"></p></main></body></html>
