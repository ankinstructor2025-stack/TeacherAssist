<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>指導案一覧 | TeacherAssist</title>
  <link rel="stylesheet" href="../css/theme.css?v=20261108-6">
  <script type="module" src="../js/lesson-plans.js?v=20261108-6"></script>
</head>
<body>
<main class="management-page">
  <header id="schoolToolbar" class="page-toolbar"></header>
  <p id="status" role="status">ログイン情報を確認しています…</p>
  <section id="content" class="card" hidden aria-label="指導案一覧">
    <p id="lessonContext" class="lesson-context"></p>
    <p id="listStatus" role="status"></p>
    <div class="list-scroll"><table class="subject-table">
      <thead><tr><th scope="col">指導案名</th><th scope="col">単元</th><th scope="col">時数</th><th scope="col">操作</th></tr></thead>
      <tbody id="lessonPlanList"></tbody>
    </table></div>
  </section>
  <div class="page-footer"><button id="logoutButton" class="btn" type="button">ログアウト</button></div>
  <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
